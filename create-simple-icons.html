<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create PWA Icons</title>
    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            background: #0a0a0a;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }
        .icon-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .icon-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        canvas {
            border: 1px solid #333;
            margin: 10px 0;
        }
        .download-btn {
            background: linear-gradient(135deg, #00ff88, #8b5cf6);
            color: #0a0a0a;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s ease;
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.3);
        }
        .download-all {
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            margin: 20px 0;
            padding: 15px 30px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <h1>🎨 Create PWA Icons for Mess Tracker</h1>
    <p>Click the download buttons to save each icon, then place them in the <code>/icons/</code> directory</p>
    
    <button class="download-btn download-all" onclick="downloadAllIcons()">📦 Download All Icons</button>
    
    <div class="icon-container" id="iconContainer">
        <!-- Icons will be generated here -->
    </div>

    <script>
        const iconSizes = [16, 32, 72, 96, 128, 144, 152, 192, 384, 512];
        
        function createIcon(size) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = size;
            canvas.height = size;
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#00ff88');
            gradient.addColorStop(1, '#8b5cf6');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // Add rounded corners
            ctx.globalCompositeOperation = 'destination-in';
            ctx.beginPath();
            ctx.roundRect(0, 0, size, size, size * 0.2);
            ctx.fill();
            
            ctx.globalCompositeOperation = 'source-over';
            
            // Draw utensil icon
            ctx.fillStyle = '#0a0a0a';
            ctx.font = `bold ${size * 0.6}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🍽️', size / 2, size / 2);
            
            return canvas;
        }
        
        function generateIcons() {
            const container = document.getElementById('iconContainer');
            container.innerHTML = '';
            
            iconSizes.forEach(size => {
                const iconItem = document.createElement('div');
                iconItem.className = 'icon-item';
                
                const canvas = createIcon(size);
                iconItem.appendChild(canvas);
                
                const label = document.createElement('p');
                label.textContent = `${size}x${size} - icon-${size}x${size}.png`;
                iconItem.appendChild(label);
                
                const downloadBtn = document.createElement('button');
                downloadBtn.className = 'download-btn';
                downloadBtn.textContent = 'Download';
                downloadBtn.onclick = () => downloadIcon(canvas, `icon-${size}x${size}.png`);
                iconItem.appendChild(downloadBtn);
                
                container.appendChild(iconItem);
            });
        }
        
        function downloadIcon(canvas, filename) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        function downloadAllIcons() {
            iconSizes.forEach((size, index) => {
                setTimeout(() => {
                    const canvas = createIcon(size);
                    downloadIcon(canvas, `icon-${size}x${size}.png`);
                }, index * 200); // Stagger downloads
            });
        }
        
        // Generate icons on load
        generateIcons();
    </script>
</body>
</html>
