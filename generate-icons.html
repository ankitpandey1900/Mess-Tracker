<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Generator - Mess Tracker</title>
    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            background: #0a0a0a;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }
        .icon-generator {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        canvas {
            border: 1px solid #333;
            margin: 10px;
        }
        .download-btn {
            background: linear-gradient(135deg, #00ff88, #8b5cf6);
            color: #0a0a0a;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s ease;
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.3);
        }
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .icon-item {
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>
    <div class="icon-generator">
        <h1>🎨 Mess Tracker Icon Generator</h1>
        <p>Generate PWA icons for Mess Tracker</p>
        
        <div class="icon-grid" id="iconGrid">
            <!-- Icons will be generated here -->
        </div>
        
        <button class="download-btn" onclick="downloadAllIcons()">📦 Download All Icons</button>
    </div>

    <script>
        const iconSizes = [
            { size: 16, name: 'icon-16x16.png' },
            { size: 32, name: 'icon-32x32.png' },
            { size: 72, name: 'icon-72x72.png' },
            { size: 96, name: 'icon-96x96.png' },
            { size: 128, name: 'icon-128x128.png' },
            { size: 144, name: 'icon-144x144.png' },
            { size: 152, name: 'icon-152x152.png' },
            { size: 192, name: 'icon-192x192.png' },
            { size: 384, name: 'icon-384x384.png' },
            { size: 512, name: 'icon-512x512.png' }
        ];

        function createIcon(size) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = size;
            canvas.height = size;
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#00ff88');
            gradient.addColorStop(1, '#8b5cf6');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // Add rounded corners
            ctx.globalCompositeOperation = 'destination-in';
            ctx.beginPath();
            ctx.roundRect(0, 0, size, size, size * 0.2);
            ctx.fill();
            
            ctx.globalCompositeOperation = 'source-over';
            
            // Draw utensil icon
            ctx.fillStyle = '#0a0a0a';
            ctx.font = `bold ${size * 0.6}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🍽️', size / 2, size / 2);
            
            return canvas;
        }

        function generateIcons() {
            const grid = document.getElementById('iconGrid');
            grid.innerHTML = '';
            
            iconSizes.forEach(iconSize => {
                const iconItem = document.createElement('div');
                iconItem.className = 'icon-item';
                
                const canvas = createIcon(iconSize.size);
                iconItem.appendChild(canvas);
                
                const label = document.createElement('p');
                label.textContent = `${iconSize.size}x${iconSize.size}`;
                iconItem.appendChild(label);
                
                const downloadBtn = document.createElement('button');
                downloadBtn.className = 'download-btn';
                downloadBtn.textContent = 'Download';
                downloadBtn.onclick = () => downloadIcon(canvas, iconSize.name);
                iconItem.appendChild(downloadBtn);
                
                grid.appendChild(iconItem);
            });
        }

        function downloadIcon(canvas, filename) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function downloadAllIcons() {
            iconSizes.forEach(iconSize => {
                const canvas = createIcon(iconSize.size);
                setTimeout(() => {
                    downloadIcon(canvas, iconSize.name);
                }, iconSize.size * 10); // Stagger downloads
            });
        }

        // Generate icons on load
        generateIcons();
    </script>
</body>
</html>
